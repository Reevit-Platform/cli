version: 2

project_name: reevit

builds:
  - id: reevit
    main: .
    binary: reevit
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/Reevit-Platform/cli/cmd.Version={{.Version}}

archives:
  # tar.gz everywhere (including windows) so the dependency-free npm
  # installer only needs gunzip + a minimal tar reader.
  - id: default
    formats: [tar.gz]
    name_template: >-
      reevit_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"

release:
  github:
    owner: Reevit-Platform
    name: cli
  draft: false
  name_template: "Reevit CLI {{ .Version }}"
  header: |
    Set up Reevit in a supported project, generate a working checkout and
    webhook integration, and test the complete payment flow locally.

    ## Install

    ```sh
    npm install -g @reevit/cli@{{ .Version }}
    # or
    brew install reevit-platform/tap/reevit
    ```

    Get started inside your application:

    ```sh
    reevit init
    ```
  footer: |
    ## Learn more

    - [Five-minute quickstart](https://www.npmjs.com/package/@reevit/cli)
    - [Complete CLI guide](https://github.com/Reevit-Platform/cli#readme)
    - [Report an issue](https://github.com/Reevit-Platform/cli/issues)

homebrew_casks:
  - name: reevit
    repository:
      owner: Reevit-Platform
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/Reevit-Platform/cli
    description: "Set up Reevit, generate checkout and webhook integrations, and test payments locally"
    license: MIT
    caveats: |
      Get started inside your application:

        cd your-project
        reevit init

      Documentation:
        https://github.com/Reevit-Platform/cli#readme
    # The binary is not notarized — clear the quarantine bit on install.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/reevit"]
          end
