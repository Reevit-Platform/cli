name: SDK Docs Drift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk-hardening:
    name: Validate SDK Docs And Release Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-28)

      - name: Validate SDK docs against exported surfaces
        run: node scripts/check-sdk-docs.js

      - name: Validate SDK examples
        run: node scripts/check-sdk-examples.js

      - name: Validate SDK release artifacts
        run: node scripts/check-sdk-release.js

      - name: Compile Rust SDK documentation examples
        run: cargo test --manifest-path sdks/rust/Cargo.toml --doc --locked
